name: Deploy database

# Every push to main deploys the app on Vercel; this brings the database along:
# migrations first, then the Catalog (ADR 0005) and the Initial Import of new Technologies.
# Every step is idempotent.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the remote database at the same time.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `supabase link` here. That step authenticates against the Management API with a personal
      # access token, and on 2026-10-06 it started answering `FGA Authentication Error. Unauthorized`
      # to four different tokens, one of them with full account access, while the same API answered a
      # local CLI session. The connection string is the only credential `db push` needs, and it is
      # the one the migrations run on anyway, so the token is a dependency the job can do without.
      #
      # The address is composed from the secrets already here, so no new one is needed. Session mode
      # (port 5432), never the transaction pooler on 6543: a migration needs a session. The host is
      # the one the CLI itself resolves for this project; it changes only if the project moves region.
      - name: Push the migrations
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # A password travels inside a URL, so it is percent-encoded, and the encoded form is masked
          # as well: GitHub hides the secret itself, not a transformation of it.
          encoded=$(jq -rn --arg password "$DB_PASSWORD" '$password|@uri')
          echo "::add-mask::$encoded"
          pnpm exec supabase db push --db-url "postgresql://postgres.$PROJECT_REF:$encoded@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"

  catalog:
    needs: migrations
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # The job's own token: enough to read public releases, with a higher GitHub rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:sync
