name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Un tetto su ogni job: senza, un run appeso tiene un runner fino al limite di sei ore
    # (issue #178). Questo job gira in tre o quattro minuti.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `typecheck` lancia `next typegen` prima di `tsc`, perche' da quando il layout sta sotto
      # `app/[locale]` il codice usa `LayoutProps<"/[locale]">` e `next/root-params`, i cui tipi li
      # genera Next in `.next/types` (ADR 0008). `next typegen` carica `next.config.ts`, che valida
      # l'ambiente, quello pubblico e quello server. Questi quattro valori non vengono letti da
      # niente: sono le sole obbligatorie dei due schemi, e servono a far passare Zod in un job che
      # non ha ne' un database ne' un sito. Le due chiavi portano il prefisso che lo schema pretende.
      - run: pnpm typecheck
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_typecheck_only
          SUPABASE_SECRET_KEY: sb_secret_typecheck_only
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    # Il 2026-10-22 questo job e' restato appeso cinque ore e mezza su `playwright install --with-deps`
    # prima che lo cancellassimo. Gira in meno di venti minuti quando non si appende (issue #178).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Applies every migration from scratch; services the tests do not use are skipped.
      - run: pnpm exec supabase start -x studio,postgres-meta,imgproxy
      - run: pnpm test:integration
      # The app is built and tested end to end against the local stack, with the real Catalog synced.
      - name: Point the app at local Supabase
        run: |
          pnpm exec supabase status -o env | grep -E "^[A-Z_]+=" > supabase.env
          . ./supabase.env
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            # Lets the end-to-end tests sign a test Developer in without GitHub OAuth.
            echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
          rm supabase.env
      # Same variables as the Deploy database workflow, so a dependency on the app env fails here.
      # The Initial Import reads the real npm and GitHub Sources.
      - run: env -u NEXT_PUBLIC_SITE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY pnpm catalog:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # ⚠️ **Temporaneo, da togliere prima del merge.** E' la prova che la #178 chiede: i
      # quattro test che cadevano, venti volte di fila e senza retry, qui dove cadevano.
      - name: I venti giri della #178 (temporaneo)
        run: >-
          pnpm exec playwright test tests/e2e/dashboard.spec.ts tests/e2e/technology.spec.ts
          tests/e2e/technology-follow.spec.ts tests/e2e/notification-settings.spec.ts
          -g "keeps the verdict short|carries the mark beside the headline|can only unfollow a retired Technology|a press is saved on the server"
          --repeat-each=20 --retries=0
