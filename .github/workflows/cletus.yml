# Il grilletto. Si copia in .github/workflows/cletus.yml del repo su cui Cletus deve lavorare,
# e per essere lanciabile deve stare sul branch di default.
#
# Qui c'e' solo il "quando" e i permessi: la macchina vive in
# RobertoZeppilli/Cletus/.github/workflows/cletus-lavora.yml, e questo file la chiama. Vuol dire
# che turni, minuti, modello e prompt si cambiano nel repo Cletus e valgono subito ovunque, senza
# una PR per progetto. Questo file invece non dovrebbe cambiare quasi mai.
#
# NON va installato nel repo Cletus: quello e' l'officina del bot, non un cantiere. Il workflow
# chiamato si rifiuta di partire la', e non e' una buona intenzione, e' un controllo.
#
# Serve nei secret del repo bersaglio:
#   CLAUDE_CODE_OAUTH_TOKEN   da `claude setup-token`: i run usano l'abbonamento Pro
#   CLETUS_PAT                per leggere le regole dal repo Cletus e per avvisare su Telegram
# E serve la Claude GitHub App installata sul repo.

name: Cletus

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "handoff = leggi docs/HANDOFF.md e continua. issue = prendi dalla coda."
        required: false
        default: handoff
        type: choice
        options: [handoff, issue]
      issue:
        description: "Numero della issue. Solo in modo issue; vuoto = scegli tu."
        required: false
        type: string
      nota:
        description: "Istruzione in piu' per questo giro"
        required: false
        type: string
  issues:
    types: [labeled]

jobs:
  lavora:
    # Su un repo pubblico chiunque apre una issue, quindi il cancello e' l'etichetta, che la
    # mette Roberto. L'action controlla da sola che chi ha scatenato il run abbia accesso in
    # scrittura e che non sia un bot.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-for-agent'

    uses: RobertoZeppilli/Cletus/.github/workflows/cletus-lavora.yml@main

    # I permessi restano qui: sono di questo repo, e vederli nel repo che li concede e' il punto.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    with:
      modo: ${{ github.event_name == 'issues' && 'issue' || inputs.modo }}
      issue: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue }}
      nota: ${{ inputs.nota }}

    secrets: inherit
